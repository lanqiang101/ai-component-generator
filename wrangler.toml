# Cloudflare Pages 配置
name = "ai-component-generator"
compatibility_date = "2026-04-21"

# 构建输出目录
pages_build_output_dir = "dist"

# 开发服务器代理配置
[dev]
ip = "127.0.0.1"
port = 8788
local_protocol = "http"
upstream_protocol = "http"

# 生产环境配置
[env.production]
vars = { ENV_TYPE = "production" }

# 预览环境配置 (原 development 改为 preview)
[env.preview]
vars = { ENV_TYPE = "preview" }

# 注意: Git 自动部署配置应在 Cloudflare Dashboard 中设置,而非在此文件中定义
# 分支与环境的映射关系:
# - main 分支 → production 环境
# - daily 分支 → preview 环境