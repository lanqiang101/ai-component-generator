# Cloudflare Pages 配置
name = "ai-component-generator"
compatibility_date = "2026-04-21"

# 构建输出目录
pages_build_output_dir = "dist"

# 开发服务器代理配置
[dev]
ip = "127.0.0.1"
port = 8788
local_protocol = "http"
upstream_protocol = "http"

# 生产环境配置
[env.production]
vars = { ENV_TYPE = "production" }

# 开发环境配置
[env.development]
vars = { ENV_TYPE = "development" }

# Git 自动部署配置
[deploy]
branch = "main"
env = "production"

[deploy.development]
branch = "daily"
env = "development"